version: "3.9"

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: aavahan
      MYSQL_USER: aavahan_user
      MYSQL_PASSWORD: aavahan_pass
      MYSQL_ROOT_PASSWORD: root_pass
    ports:
      - "3307:3306"
    volumes:
      - mysqldata:/var/lib/mysql
      - ./database/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
      - ./database/migrations/002_announcements_and_managers.sql:/docker-entrypoint-initdb.d/002_announcements_and_managers.sql
      - ./database/migrations/003_event_comments.sql:/docker-entrypoint-initdb.d/003_event_comments.sql
      - ./database/migrations/004_checkin_codes_and_password_reset.sql:/docker-entrypoint-initdb.d/004_checkin_codes_and_password_reset.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uaavahan_user", "-paavahan_pass"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: aavahan
      DB_USER: aavahan_user
      DB_PASSWORD: aavahan_pass
      JWT_SECRET: ${JWT_SECRET:-dev_only_change_me}
      JWT_EXPIRES_IN: 7d
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  mysqldata:
