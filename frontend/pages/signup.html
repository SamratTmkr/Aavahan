<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up — Aavahan</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/pages.css">
</head>
<body class="auth-page-body">
    <!-- Top Navigation Bar -->
    <header class="navbar">
        <div class="container nav-container">
            <a href="../index.html" class="brand">
                <span>Aavahan</span>
                <span class="brand-dot"></span>
            </a>

            <div class="nav-right">
                <span class="auth-nav-note">Already a member?</span>
                <a href="login.html" class="btn btn-outline btn-pill btn-sm">Log in</a>
            </div>
        </div>
    </header>

    <!-- Centered Sign Up Card -->
    <main class="container auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="brand auth-brand">
                    <span>Aavahan</span>
                    <span class="brand-dot"></span>
                </div>
                <h1 class="auth-heading">Sign up</h1>
            </div>

            <!-- Social Buttons -->
            <div class="social-auth-group">
                <button type="button" class="btn btn-outline btn-pill btn-block btn-social" onclick="showToast('Google Sign-Up is currently unavailable', 'info')">
                    <svg width="18" height="18" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                    </svg>
                    <span>Sign up with Google</span>
                </button>

                <button type="button" class="btn btn-outline btn-pill btn-block btn-social" onclick="showToast('Apple Sign-Up is currently unavailable', 'info')">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.86c.62-.77 1.05-1.84.93-2.91-.91.04-2 .61-2.65 1.38-.57.66-.99 1.74-.86 2.78 1.01.08 2-.51 2.58-1.25z"/>
                    </svg>
                    <span>Sign up with Apple</span>
                </button>
            </div>

            <div class="auth-divider">
                <div class="auth-divider-line"></div>
                <span class="auth-divider-text">or</span>
                <div class="auth-divider-line"></div>
            </div>

            <!-- Main Sign Up Form -->
            <form id="signupForm">
                <div class="form-group">
                    <label class="form-label" for="fullName">Your name</label>
                    <input type="text" id="fullName" class="form-input" placeholder="Your full name" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" id="email" class="form-input" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="At least 6 characters" required>
                </div>

                <div class="auth-terms-note">
                    By signing up, you agree to Aavahan's <a href="#" class="auth-terms-link">Terms of Service</a> and <a href="#" class="auth-terms-link">Privacy Policy</a>.
                </div>

                <button type="submit" class="btn btn-primary btn-pill btn-block btn-lg">Sign up</button>
            </form>
        </div>
    </main>

    <!-- Footer Component -->
    <div id="site-footer"></div>

    <!-- Scripts -->
    <script type="module" src="../assets/js/api.js"></script>
    <script type="module" src="../assets/js/main.js"></script>
    <script type="module" src="../assets/js/auth.js"></script>
</body>
</html>
