<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up — Aavahan</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/pages.css">
</head>
<body class="auth-page-body">
    <!-- Top Navigation Bar -->
    <header class="navbar">
        <div class="container nav-container">
            <a href="../index.html" class="brand">
                <span>Aavahan</span>
                <span class="brand-dot"></span>
            </a>

            <div class="nav-right">
                <span class="auth-nav-note">Already a member?</span>
                <a href="login.html" class="btn btn-outline btn-pill btn-sm">Log in</a>
            </div>
        </div>
    </header>

    <!-- Centered Sign Up Card -->
    <main class="container auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="brand auth-brand">
                    <span>Aavahan</span>
                    <span class="brand-dot"></span>
                </div>
                <h1 class="auth-heading">Sign up</h1>
            </div>

            <!-- Main Sign Up Form -->
            <form id="signupForm">
                <div class="form-group">
                    <label class="form-label" for="fullName">Your name</label>
                    <input type="text" id="fullName" class="form-input" placeholder="Your full name" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" id="email" class="form-input" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="Min. 6 chars (A-Z, a-z, 0-9)" required>
                    <small class="form-hint" style="color: var(--text-muted, #94a3b8); font-size: 0.8rem; margin-top: 4px; display: block;">At least 6 characters with uppercase, lowercase, and a number.</small>
                </div>

                <div class="auth-terms-note">
                    By signing up, you agree to Aavahan's community guidelines.
                </div>

                <button type="submit" class="btn btn-primary btn-pill btn-block btn-lg">Sign up</button>
            </form>
        </div>
    </main>

    <!-- Footer Component -->
    <div id="site-footer"></div>

    <!-- Scripts -->
    <script type="module" src="../assets/js/api.js"></script>
    <script type="module" src="../assets/js/main.js"></script>
    <script type="module" src="../assets/js/auth.js"></script>
</body>
</html>
