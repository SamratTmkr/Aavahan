<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in — Aavahan</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/pages.css">
</head>
<body class="auth-page-body">
    <!-- Top Navigation Bar -->
    <header class="navbar">
        <div class="container nav-container">
            <a href="../index.html" class="brand">
                <span>Aavahan</span>
                <span class="brand-dot"></span>
            </a>

            <div class="nav-right">
                <span class="auth-nav-note">Not a member yet?</span>
                <a href="signup.html" class="btn btn-outline btn-pill btn-sm">Sign up</a>
            </div>
        </div>
    </header>

    <!-- Centered Auth Box -->
    <main class="container auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="brand auth-brand">
                    <span>Aavahan</span>
                    <span class="brand-dot"></span>
                </div>
                <h1 class="auth-heading">Log in</h1>
            </div>

            <!-- Main Login Form -->
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="email">Email address</label>
                    <input type="email" id="email" class="form-input" placeholder="you@example.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <div class="auth-password-header">
                        <label class="form-label auth-password-label" for="password">Password</label>
                        <a href="reset-password.html" class="auth-forgot-link">Forgot password?</a>
                    </div>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
                </div>

                <button type="submit" id="btnLoginSubmit" class="btn btn-primary btn-pill btn-block btn-lg auth-submit-btn">Log in</button>
            </form>
        </div>
    </main>

    <!-- Footer Component -->
    <div id="site-footer"></div>

    <!-- Scripts -->
    <script type="module" src="../assets/js/api.js"></script>
    <script type="module" src="../assets/js/main.js"></script>
    <script type="module" src="../assets/js/auth.js"></script>
</body>
</html>
