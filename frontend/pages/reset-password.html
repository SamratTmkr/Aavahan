<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset password — Aavahan</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/pages.css">
</head>
<body class="auth-page-body">
    <!-- Top Navigation Bar -->
    <header class="navbar">
        <div class="container nav-container">
            <a href="../index.html" class="brand">
                <span>Aavahan</span>
                <span class="brand-dot"></span>
            </a>

            <div class="nav-right">
                <span class="auth-nav-note">Remembered it?</span>
                <a href="login.html" class="btn btn-outline btn-pill btn-sm">Log in</a>
            </div>
        </div>
    </header>

    <main class="container auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="brand auth-brand">
                    <span>Aavahan</span>
                    <span class="brand-dot"></span>
                </div>
                <h1 class="auth-heading" id="resetHeading">Reset password</h1>
            </div>

            <!-- Step 1: ask for the email address -->
            <form id="requestResetForm">
                <p class="auth-subtext">Enter the email you signed up with and we will send you a link to choose a new password.</p>

                <div class="form-group">
                    <label class="form-label" for="resetEmail">Email address</label>
                    <input type="email" id="resetEmail" class="form-input" placeholder="you@example.com" required autocomplete="email">
                </div>

                <button type="submit" id="btnRequestReset" class="btn btn-primary btn-pill btn-block btn-lg auth-submit-btn">Send reset link</button>
            </form>

            <!-- Step 2: shown instead when the page is opened from the emailed link -->
            <form id="newPasswordForm" hidden>
                <p class="auth-subtext">Choose a new password. It needs at least 6 characters, including an uppercase letter, a lowercase letter and a number.</p>

                <div class="form-group">
                    <label class="form-label" for="newPassword">New password</label>
                    <input type="password" id="newPassword" class="form-input" placeholder="••••••••" required autocomplete="new-password">
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirmPassword">Confirm new password</label>
                    <input type="password" id="confirmPassword" class="form-input" placeholder="••••••••" required autocomplete="new-password">
                </div>

                <button type="submit" id="btnSetPassword" class="btn btn-primary btn-pill btn-block btn-lg auth-submit-btn">Update password</button>
            </form>

            <div id="resetDoneMessage" class="auth-subtext" hidden></div>
        </div>
    </main>

    <!-- Footer Component -->
    <div id="site-footer"></div>

    <!-- Scripts -->
    <script type="module" src="../assets/js/api.js"></script>
    <script type="module" src="../assets/js/main.js"></script>
    <script type="module" src="../assets/js/reset-password.js"></script>
</body>
</html>
