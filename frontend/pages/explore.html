<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Find events and groups near you on Aavahan. Meet new people, join communities, and attend meetups.">
    <title>Find Events & Groups — Aavahan</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

    <!-- CSS Stylesheets -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/pages.css">
</head>
<body>
    <!-- Header Component -->
    <div id="site-header"></div>

    <main class="container explore-page">
        <!-- Page Title & Subtitle -->
        <div class="explore-header">
            <h1 class="explore-title">Explore Events</h1>
            <p class="explore-subtitle">Discover meetups, workshops, and activities happening across Nepal.</p>
        </div>

        <!-- Meetup Pill Filter Bar -->
        <div class="meetup-filter-bar">
            <!-- Event Type (In-person vs Online) -->
            <select id="filterTypeSelect" class="meetup-filter-dropdown" aria-label="Filter by event type">
                <option value="all">Any type</option>
                <option value="in-person">In person</option>
                <option value="online">Online</option>
            </select>

            <!-- Distance / Location -->
            <select id="filterCitySelect" class="meetup-filter-dropdown" aria-label="Filter by location">
                <option value="all">All Locations</option>
            </select>

            <!-- Category -->
            <select id="filterCategorySelect" class="meetup-filter-dropdown" aria-label="Filter by category">
                <option value="all">Any category</option>
                <option value="technology">Technology & AI</option>
                <option value="music">Live Music</option>
                <option value="business">Career & Business</option>
                <option value="outdoor">Nature & Outdoors</option>
                <option value="social">Social & Dining</option>
                <option value="culture">Arts & Culture</option>
            </select>

            <!-- Day / Date -->
            <select id="filterDaySelect" class="meetup-filter-dropdown" aria-label="Filter by day">
                <option value="all">Any day</option>
                <option value="today">Today</option>
                <option value="tomorrow">Tomorrow</option>
                <option value="weekend">This weekend</option>
                <option value="week">Next week</option>
            </select>

            <!-- Sort -->
            <select id="filterSortSelect" class="meetup-filter-dropdown meetup-filter-sort" aria-label="Sort by">
                <option value="date">Sort by: Date</option>
                <option value="price-low">Sort by: Price (Low to High)</option>
                <option value="price-high">Sort by: Price (High to Low)</option>
            </select>
        </div>

        <!-- Feed Results Subtitle -->
        <div id="feedResultsCount" class="explore-results-count"></div>

        <!-- Events Feed Section (Date Grouped) -->
        <div id="meetupEventsFeedSection">
            <!-- Dynamically populated by events.js -->
        </div>
    </main>

    <!-- Footer Component -->
    <div id="site-footer"></div>

    <!-- Scripts -->
    <script type="module" src="../assets/js/api.js"></script>
    <script type="module" src="../assets/js/main.js"></script>
    <script type="module" src="../assets/js/events.js"></script>
</body>
</html>
