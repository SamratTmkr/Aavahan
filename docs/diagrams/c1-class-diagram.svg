<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920">
  <style>text{font-family:Arial,sans-serif;fill:#16202a}.t{font-size:17px}.h{font-size:20px;font-weight:bold}.s{font-size:15px}.box{fill:#fff;stroke:#334e68;stroke-width:2}.entity{fill:#e8f3ff}.control{fill:#fff2d8}.boundary{fill:#e9f8ef}.line{stroke:#425b72;stroke-width:2}.dash{stroke:#425b72;stroke-width:2;stroke-dasharray:7 5;fill:none}.label{font-size:15px;fill:#334e68}</style>
  <rect width="1400" height="920" fill="#fafcff"/><text x="45" y="46" class="h">C1. Design Class Diagram — Event Registration</text><text x="45" y="72" class="s">Each class represents a module and its responsibilities.</text>
  <g transform="translate(80 130)"><rect class="box entity" width="250" height="188" rx="7"/><text x="125" y="31" text-anchor="middle" class="h">«entity» User</text><path class="line" d="M0 45H250"/><text x="14" y="72" class="t">id, name, email</text><text x="14" y="98" class="t">passwordHash, role</text><text x="14" y="124" class="t">avatarUrl, createdAt</text></g>
  <g transform="translate(570 105)"><rect class="box entity" width="300" height="250" rx="7"/><text x="150" y="31" text-anchor="middle" class="h">«entity» Event</text><path class="line" d="M0 45H300"/><text x="14" y="72" class="t">id, title, description</text><text x="14" y="98" class="t">category, venue, city</text><text x="14" y="124" class="t">eventDate, startTime</text><text x="14" y="150" class="t">isDateTba, capacity</text><text x="14" y="176" class="t">attendeeCount, isFree</text><text x="14" y="202" class="t">organizerId</text><path class="line" d="M0 217H300"/><text x="14" y="241" class="t">+ isFull()</text></g>
  <g transform="translate(1060 130)"><rect class="box entity" width="250" height="175" rx="7"/><text x="125" y="31" text-anchor="middle" class="h">«entity» Rsvp</text><path class="line" d="M0 45H250"/><text x="14" y="74" class="t">id, eventId, userId</text><text x="14" y="100" class="t">status, createdAt</text><text x="14" y="140" class="s">{unique(eventId, userId)}</text></g>
  <g transform="translate(570 440)"><rect class="box entity" width="300" height="150" rx="7"/><text x="150" y="31" text-anchor="middle" class="h">«entity» Announcement</text><path class="line" d="M0 45H300"/><text x="14" y="74" class="t">id, eventId, authorId</text><text x="14" y="100" class="t">title, message, createdAt</text></g>
  <path class="line" d="M330 195H570"/><text x="346" y="184" class="label">1 organises 0..*</text><path class="line" d="M870 195H1060"/><text x="887" y="184" class="label">1 receives 0..*</text><path class="line" d="M205 318V410H570"/><text x="220" y="401" class="label">1 authors 0..*</text><path class="line" d="M720 355V440"/><text x="730" y="402" class="label">1 has 0..*</text>
  <g transform="translate(80 660)"><rect class="box control" width="255" height="105" rx="7"/><text x="128" y="31" text-anchor="middle" class="h">«control» Auth</text><text x="14" y="64" class="t">AuthMiddleware</text><text x="14" y="88" class="t">AuthController</text></g>
  <g transform="translate(470 635)"><rect class="box control" width="315" height="150" rx="7"/><text x="158" y="31" text-anchor="middle" class="h">«control» EventController</text><text x="14" y="63" class="t">createEvent(), getEvent()</text><text x="14" y="88" class="t">rsvp(), cancelRsvp()</text><text x="14" y="113" class="t">getAttendees()</text><text x="14" y="138" class="t">→ EventModel</text></g>
  <g transform="translate(990 660)"><rect class="box boundary" width="290" height="105" rx="7"/><text x="145" y="31" text-anchor="middle" class="h">«boundary» Frontend</text><text x="14" y="64" class="t">ApiClient · AuthService</text><text x="14" y="88" class="t">Event pages</text></g>
  <path class="dash" d="M335 712H470M785 712H990M628 635V355"/><text x="535" y="620" class="label">uses</text><text x="600" y="344" class="label">controls</text>
  <text x="80" y="860" class="s">Constraint: eventDate is null if and only if isDateTba = true.</text>
</svg>
