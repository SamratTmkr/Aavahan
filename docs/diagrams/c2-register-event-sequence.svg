<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1080" viewBox="0 0 1400 1080">
<style>text{font-family:Arial,sans-serif;fill:#17212b}.h{font-size:23px;font-weight:bold}.t{font-size:15px}.s{font-size:13px}.head{fill:#edf3f9;stroke:#3d5a73}.life{stroke:#718096;stroke-dasharray:6 5}.msg{stroke:#334e68;stroke-width:2;marker-end:url(#a)}.ret{stroke:#334e68;stroke-width:2;stroke-dasharray:6 4;marker-end:url(#a)}.alt{fill:#f8fbff;stroke:#58718a;stroke-width:2}.note{fill:#fff8d9;stroke:#957a2c}</style><defs><marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5 0 7z" fill="#334e68"/></marker></defs>
<rect width="1400" height="1080" fill="#fff"/><text x="40" y="42" class="h">C2. UC5 — Register for an Event</text>
<g class="t"><rect class="head" x="45" y="70" width="140" height="42"/><text x="115" y="97" text-anchor="middle">Participant</text><rect class="head" x="260" y="70" width="145" height="42"/><text x="332" y="97" text-anchor="middle">EventDetailPage</text><rect class="head" x="480" y="70" width="105" height="42"/><text x="532" y="97" text-anchor="middle">ApiClient</text><rect class="head" x="660" y="70" width="135" height="42"/><text x="727" y="97" text-anchor="middle">AuthMiddleware</text><rect class="head" x="875" y="70" width="130" height="42"/><text x="940" y="97" text-anchor="middle">EventController</text><rect class="head" x="1115" y="70" width="110" height="42"/><text x="1170" y="97" text-anchor="middle">Database</text></g>
<path class="life" d="M115 112V1040M332 112V1040M532 112V1040M727 112V1040M940 112V1040M1170 112V1040"/>
<path class="msg" d="M115 150H332"/><text x="175" y="142" class="t">click “Register”</text><path class="msg" d="M332 195H532"/><text x="375" y="187" class="t">rsvpToEvent(eventId)</text><path class="msg" d="M532 240H727"/><text x="545" y="232" class="t">POST /events/:id/rsvp + token</text><path class="msg" d="M727 285H1170"/><text x="810" y="277" class="t">verify token; find user</text><path class="ret" d="M1170 315H727"/><text x="915" y="307" class="s">user</text><path class="msg" d="M727 350H940"/><text x="760" y="342" class="t">rsvp(eventId, user)</text><path class="msg" d="M940 395H1170"/><text x="980" y="387" class="t">BEGIN TRANSACTION</text><path class="msg" d="M940 440H1170"/><text x="960" y="432" class="t">SELECT event FOR UPDATE</text><rect class="note" x="1020" y="456" width="300" height="54"/><text x="1030" y="478" class="s">Row lock held until commit:</text><text x="1030" y="496" class="s">last place cannot be double-booked.</text>
<rect class="alt" x="850" y="530" width="430" height="330"/><text x="865" y="552" class="t">alt</text><path class="alt" d="M850 610H1280M850 690H1280M850 770H1280"/><text x="870" y="579" class="t">[event not found]  ROLLBACK → 404</text><text x="870" y="659" class="t">[already registered]  ROLLBACK → 200</text><text x="870" y="739" class="t">[capacity reached]  ROLLBACK → 409</text><text x="870" y="819" class="t">[available] INSERT RSVP; UPDATE count; COMMIT → 200</text>
<path class="ret" d="M940 910H532"/><text x="680" y="901" class="t">JSON response</text><path class="ret" d="M532 950H332"/><text x="395" y="941" class="t">result</text><path class="ret" d="M332 990H115"/><text x="145" y="981" class="t">Show “Registered” / error toast</text>
</svg>
